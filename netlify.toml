# No build step. This is a static site. Netlify serves the folder as-is.
[build]
  publish = "."

# Basic hardening headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Internal notes stay in the repo but are never served publicly.
[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/images/README.md"
  to = "/404"
  status = 404
  force = true
